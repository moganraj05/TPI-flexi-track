# Serves the built HR console and forwards API + live-update traffic to the
# backend container ("backend" is its service name on the compose network).

# Upgrade header for WebSockets only when the client asks for one.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Matches the backend's 5 MB upload limit (src/middleware/upload.js),
  # with headroom for multipart overhead.
  client_max_body_size 10m;

  # The shared server Nginx sits in front of this one. Trust the client IP it
  # passes along (private-network senders only), so the backend's per-IP
  # rate limits see each real user instead of one proxy address.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append), so the backend (TRUST_PROXY=1) reads exactly
    # the client IP resolved above and can't be fed a spoofed chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # socket.io live updates (WebSocket transport only, see SocketContext.jsx).
  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Vite's hashed bundles never change content under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Always re-check these so a new deploy is picked up immediately.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # React Router: any unknown path loads the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
